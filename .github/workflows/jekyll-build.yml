name: Check website

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build personal pages
        run: python build.py
      - name: Verify content and navigation
        run: python validate.py
      - name: Check generated pages are current
        run: git diff --exit-code
