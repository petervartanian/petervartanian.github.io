`,Nr=`# *Agency Costs* — Data dictionary

Peter H. Vartanian · Michael Wong · Casey Tewey

v0.1 · Revised 9 September 2026

This dictionary accompanies record-template.json and methods-note.md, whose proposed common record is at schema version 0.4 while validation and wider adoption are pending.

The separate example collection uses example_schema_version 1.2, with jurisdictions entries for role, entity and location alongside paymentRoute for the stipulated settlement path. Each record also carries execution steps (actor, action), accounting entries (item, treatment) and followUp (asOf, recovery, outstanding). These distinguish actor roles, legitimate expenditure, asset recovery and unsettled balances. Country-level locations provide context for events and amounts that remain constructed.

## Coding conventions

- An unavailable value is null, with its reason in review.missing_fields_and_reasons, whereas zero denotes a documented zero.
- Dates follow ISO 8601 with timezone where known, at a precision supported by the available evidence.
- A three-letter code identifies the currency, with any conversion supported by its date, rate and source. Comparisons across years also distinguish nominal from inflation-adjusted amounts.
- lower and upper hold the monetary endpoints, which are equal for an exact documented value. A range retains its evidence or estimation basis, while a statistical confidence interval requires a method that supports that interpretation.
- Every material assertion has a field_evidence entry so constructed values can remain identifiable as stipulated and measured values as observed.

## Record identity

| Field | Type / allowed values | Meaning |
| --- | --- | --- |
| schema_version | Text | Version of these coding rules. |
| record_id | Unique text | Stable identifier assigned separately to each distinct event. |
| shared_event_id | Text or null | Connects records once a common mechanism establishes that they belong to the same multi-party event. |
| record_kind | observed_event; constructed_scenario | Separates contributed or public events from teaching examples. |
| title | Text | Plain-language event title, with identifying details limited to the authorised release scope. |
| event_status | incident; near_miss; hazard; unknown | Incident: harm realised. Near miss: credible harmful progression with the specified harm averted. Hazard: potential source of harm without a qualifying realised event. Describe mixed outcomes. |
| dates | ISO timestamps / dates | event_start, detected, stopped and loss_assessed, with unavailable dates left unknown. |

## Scope and authority

| Field within scope | Meaning |
| --- | --- |
| industry / workflow | Broad industry and the specific operation, such as refund authorisation. |
| intended_task | What the system was meant to accomplish. |
| agent_authority | Decisions and actions the agent could take autonomously. |
| permissions_and_limits | Who granted authority; technical scope, payment limits and approval conditions. |
| model_version / harness_version / integration_version / policy_version | Identifiers for the components and rules in effect, with unknown versions left explicit. |
| shared_dependencies | Provider, model, integration, data source or payment-rail dependencies, with the population sharing each where known. |
| jurisdictions | Relevant operator, provider, affected-party and settlement locations, while legal responsibility requires a separate assessment under the applicable evidence and law. |

## Event and causes

| Field within event | Meaning |
| --- | --- |
| initiating_event | The event that began the failure sequence. |
| actual_action | What the agent did or attempted. |
| execution_trail | Ordered entries with actor, action, timestamp and evidence_refs. Separate the agent’s decision from retrieval, harness, execution-gate and human actions. |
| verified_environment_change | Verified changes to the ledger, account, database or other real system, supported by environment evidence. |
| affected_parties | Parties and types of harm; use non-identifying categories where appropriate. |
| contributing_causes | List of objects: category, role, description, confidence, evidence_refs. |
| competing_explanations | Plausible alternative explanations and unresolved attribution. |
| detection_and_response | How the event was noticed, who acted, what was stopped and what continued. |
| recovery_status | Pending, partial, complete, unavailable or unknown; include rationale and as-of date. |

Cause categories are model, harness_or_tooling, integration, data, human, external and unknown, with several permitted in the same account. Each contributor has an initiating, enabling, amplifying or uncertain role supported by evidence for that hypothesis or finding, while legal liability receives a separate assessment.

## Exposure

| Field within exposure | Meaning |
| --- | --- |
| population | Which deployments, organisations or accounts were monitored. |
| unit / counting_rule | Transaction, decision, task or another defined opportunity; specify treatment of retries and multi-action tasks. |
| period_start / period_end | Common time window for both numerator and denominator. |
| operation_count | Total relevant operations, including successful ones, in the stated population and period. |
| event_count | Qualifying events under a stated counting rule. Distinguish a single incident from its many erroneous transactions. |
| numerator_unit | What event_count counts: incidents, failed operations or another explicitly defined unit. |
| population_match_verified | true, false or null. Whether numerator and denominator describe the same population. |
| period_and_unit_match_verified | true, false or null. Whether the observation periods and defined counting units are compatible. Both matching checks must be true before reporting a rate; a positive denominator and adequate coverage are also required. |
| coverage_and_reporting_limits | Selection, under-reporting, duplicated news stories, missing operators or other biases. |

## Harm and loss

Severity runs from 1 (minor) through 2 (moderate), 3 (serious) and 4 (severe) to 5 (catastrophic), with the rationale tied to the tool-kit's provisional descriptions. Non-financial harm receives its own assessment, while a near miss is identified under event_status.

Within harm, severity_grade holds the provisional grade, whose application is explained in rationale. nonfinancial_harm lists consequences requiring an account beyond money, while null or an empty list preserves unavailable information with the gap documented explicitly.

| Field within loss | Meaning |
| --- | --- |
| accounting_boundary | Whose losses are included, over what period, and whether the record takes an operator, affected-party or wider perspective. |
| currency | Three-letter currency code for the recorded monetary components. Document any conversion. |
| direct_loss | Erroneous disbursements or other direct financial damage before recovery, under the recorded accounting boundary. |
| response_expense | Incident investigation, remediation and recovery expenses. Allocate each expense, including paid compensation, once within the accounting boundary. |
| recoveries | Non-insurance recoveries, such as returned funds. Distinguish actual receipts from estimates through basis and field_evidence. Insurance payments belong in insurance.payment_received. |
| net_loss | Direct loss + response expense − non-insurance recoveries, before insurance payments. Preserve uncertainty and date. Reconcile overlaps before summing. |
| net_loss_band | USD prototype: under $1k; $1k–under $10k; $10k–under $100k; $100k–under $1M; $1M or more; unknown. Apply bands to non-negative losses; describe negative net positions separately. |
| components_and_exclusions | What is included, excluded, unresolved, or potentially overlapping. |
| payment_entitlement_comparison | actual_paid and correct_entitlement establish the excess under the stated basis and currency. A legitimate payment stays outside incident loss. |
| asset_recoveries | Asset, valuation or net proceeds, date, selling expense and source. Count value once; avoid combining sale proceeds with a retained inventory valuation for the same asset. |
| follow_up | as_of fixes the cutoff; open_amounts identifies receivables and unknown later costs, with next_review recording the planned update when known. |
| hypothetical_exposure_separate | Potential exposure or avoided-loss estimates, with scenario assumptions. Keep these separate from realised-loss totals. |
| transfers | Payments shifting the burden between parties, such as compensation or indemnity. Record payer, recipient, amount, date and links to existing loss entries. Account for each payment once within the same boundary. |
| insurance.claim_status | No claim; pending; paid; declined; unknown, with supporting evidence. Record the coverage decision and its evidence separately. |
| insurance.coverage_basis | Documented policy or decision basis and applicable limits or exclusions; preserve disputed or unknown interpretations. |
| insurance.payment_received | Insurance payment actually received under the recorded currency and scope. Keep it separate from net loss and non-insurance recoveries. |
| insurance.as_of | Assessment date for the insurance entries. Pending claims may change. |

An uncertain net-loss range depends on documented component definitions and evidence of their relationships. Where those cannot support a defensible amount or range, the loss remains unknown.

direct_loss, response_expense, recoveries and net_loss each contain lower, upper and basis, with their source and method in field_evidence. Because insurance shifts who bears the cost of damage already incurred, the underlying loss remains in the record while retained-cost calculations use the same loss boundary and date.

## Mitigations, analogues and field evidence

Each mitigations entry contains name, risk_addressed, mechanism, owner, scope, evidence_state, evidence_refs, effectiveness_findings, operating_cost, residual_exposure, dependencies and last_tested. evidence_state records whether the safeguard is claimed, documented, tested, observed_in_operation or unknown. Since these categories describe how evidence was obtained, effectiveness still requires its own assessment.

Each historical_analogues entry contains source, precedent_type (human_workflow or earlier_automation), matching_task, matching_failure, material_differences, frequency_basis, loss_basis, detection_and_recovery, shared_dependencies and transferability_limits. Although the analogue may inform the assessment, an agent failure rate requires loss and exposure evidence from the agent workflow itself.

Each field_evidence entry contains field_path, basis (observed, estimated, inferred, stipulated), confidence (high, medium, low, not_assessed), rationale, sources and reviewer. A source's title, locator or URL, date and provenance allow it to be checked, while public references require redaction and release clearance.

High confidence denotes corroborated operational records, whereas medium confidence allows credible evidence with material gaps and low confidence reflects weak or indirect inference. These provisional grades describe evidence quality, with numerical probabilities requiring separate calibration.

## Public and operator evidence comparison

The public_operator_comparison fields define a proposed matched-evidence study for which collection and analysis remain pending.

| Field | Meaning |
| --- | --- |
| same_event_match_verified | true, false or null. Whether the public and operator accounts concern the same event. |
| evidence_cutoff | Date through which sources are eligible for comparison. |
| public_record_ref / operator_record_ref | References to the two coded accounts, respecting disclosure permissions. |
| coding_rubric_version | Version of the common coding rules used for both accounts. |
| independent_initial_coding | Whether the initial assessments were made independently and blinded to the other assessment; document any departures. |
| field_comparisons | Differences and agreements in loss ranges, recovery, cause, controls and other specified fields, with evidence references. |
| coding_effort_minutes | Time spent on the specified coding activity; state whose work and which stages are counted. |
| adjudication_notes | How disagreements were reviewed, resolved or preserved. |

## Saved assessments

Save assessment creates agency-costs-assessment format version 1.1, with example_version 1.2; version 1.0 assessments remain readable. This is a resumable browser assessment, distinct from the common event template. It contains source_examples, public comparisons, an active session, drafts for the five examples and up to 25 operator cases, calculated_workflows and follow_up. Opening a compatible file restores validated input fields and recomputes results, while source examples are supplied by the application rather than replaced by imported output fields.

Each case retains loss inputs, evidence-pack text, evidenceReview (status and reference), accountReview (cutoff, recovery position and note), comparisonNote, safeguard appraisals and dependency review (name, scope, fallback and evidence). The reader’s declarations of reviewed or tested evidence do not certify the underlying artefacts. Permission and original constructed provenance remain distinct.

The shared cohort retains failures, operations, matching confirmation and any manual loss-total override. Monetary loss per 1,000 operations and failure frequency per 100,000 operations have independent completeness checks. Case-derived totals become unknown whenever a component account is incomplete or invalid. Source and working views remain separate, with the Dividend using the working view throughout.

Import accepts files up to 2 MB, with editable strings limited to 20,000 characters and validated decision values. Operator identifiers may contain letters, numbers, periods, hyphens and underscores, up to 80 characters; EX- identifiers are reserved for the worked examples. Unknown numeric entries remain blank, while invalid numeric entries in saved assessments are retained for correction. Reset can be undone until the next edit; refreshing requires reopening a saved file to recover prior entries. No automatic remote submission or persistent browser storage is used.

## Operator records

New operator case creates a session with its own operatorCase object: identity, workflow, dates, causes, execution trail, jurisdictions, severity rationale, component evidence, exposure, historical and public-account comparisons, safeguards and second review. The common template’s scope.operator holds the permitted operator code. Every operator case is kept outside the example cohort and outside other operator cases’ exposure totals.

Save this record creates agency-costs-record version 1.0 containing the complete session, recorded completeness checks and recalculated follow-up. Import operator record reads that format or the common 0.4 template. The common import retains the complete original record, maps available fields into the working forms and leaves source review and disclosure permission unrecorded. Only exact USD component amounts enter the calculator; ranges remain attached as source material, and a different currency requires documented conversion before import. An imported net-loss total is retained as a source assertion while the working total is recalculated from components.

For safeguards, followUpOwner, followUpDate and outcome record the person responsible, next review date and observed result with its resulting decision. Second review contains reviewer, date, finding, disagreements and status (pending, revisions or complete). Substantive edits return that status to pending. Completeness checks inspect recorded fields without certifying source evidence, independent review or permission.

## Review and release

Within review, reviewers and review_date identify who checked the record. unresolved_disagreements preserves competing assessments; missing_fields_and_reasons explains unavailable information. release_permission records the permission holder, scope, date and evidence of permission. permitted_disclosure defines what may be shared. reuse_terms records the applicable licence or restriction. audit_trail records dated material changes, the editor or reviewer, the reason and supporting references. Obtain explicit release permission for each contribution and disclosure scope.
`,Pr=`# *Agency Costs* — Methods note

Peter H. Vartanian · Michael Wong · Casey Tewey

v0.1 · Revised 9 September 2026

## Scope

For an underwriter assessing an AI-agent workflow, the tool-kit brings the available evidence into a case assessment that shows where further investigation is needed. The operator supplies the incident records, loss documentation and control evidence on which that assessment depends.

The five stages follow a common event record through Evidence packs, Loss accounts, Loss-cost index, Human-claims crosswalk and Control appraisal. Once the event and its consequences are described, the losses can be compared against matched activity, human precedents can be considered, and safeguards can be appraised. The Dividend then extends the assessment into questions about deployment, authority, economics, concentration, adversarial use and access. Five constructed examples support the calculations while operator case collection and loss-rate validation are pending. A public vendor account is coded separately because its monetary loss remains undisclosed.

Payments and refunds are proposed for the pilot, subject to agreement with Keythorn on the population, period, agent authority and observation unit before empirical collection begins.

The five fictional evidence packs reflect the workflow, attribution, loss-accounting and historical-comparison requirements discussed in Keythorn Rounds A–C, although actual operator artefacts and release permissions remain outstanding. Their constructed 30-day cohort contains 30,000 payment operations, 8,000 claims operations and 12,000 customer-service operations. Among the five failed operations is one blocked attempt, while retries belong to the original operation rather than adding another count. These stipulated values demonstrate the calculation, whose empirical use will require observed losses and matched activity. Because the $50,000 transfer was blocked, only its stipulated $120 review expense enters realised loss. Case edits now flow into the working cohort, while the original example totals remain available in a separate view.

The revised examples close specific accounting gaps without changing their net totals. EX-001 recovers $1,000 through net resale proceeds from the damaged camera, with no retained inventory value counted again. EX-002 carries an open $600 supplier balance at day 5. EX-003 separates the $30,000 payout from the $12,000 entitlement before recording an $18,000 excess. EX-004 identifies the migration as a commercial concession with incremental expense rather than an established legal obligation. EX-005 retains the open payment hold and unknown later delay costs. Each record separates agent decisions, tool or integration actions and operator intervention in a short execution trail.

Case-scoped codes identify operators, suppliers and banks while country names preserve the geographic context. In EX-005, Operator E in the UK plans to pay Supplier E1 in Taiwan through receiving Bank E1 in Singapore and correspondent Bank E2 in the US, giving the proposed route UK → US → Singapore. A stipulated internal policy requires route approval, so the payment remains on hold at the review cutoff and later delay costs remain unassessed. All example amounts are already in USD, with no exchange-rate conversion modelled. For contributed cases, the approved disclosure scope would govern how identities, geography and transaction details are reviewed together and, where necessary, generalised.

## Requesting evidence

### Operator intake

New operator case opens a separate case with blank amounts, sources, exposure and review declarations. Its identity, execution account, jurisdictions, loss components, historical comparison and safeguards remain attached throughout the five tools and the Dividend. Import operator record accepts a completed common record (schema 0.4) or a previously saved operator record. Save this record produces a portable case file, while Save assessment retains every case in the workspace. Up to 25 operator cases can accompany the five worked examples.

Each operator case keeps its own exposure. The loss-cost index reports that case’s contribution per 1,000 operations once population, period, counting unit, source, reporting coverage and matching confirmation have been entered. It does not pool operator cases automatically because their populations or events may overlap. Portfolio estimates require a deduplicated inventory and consistent cutoffs, beyond this case-level calculation.

The calculator uses USD. An imported record in another currency requires a documented conversion before its amounts can enter the calculator. Ranged amounts remain in the retained source record, with the numerical field left blank until an exact value is supported. Imported common records begin with source review and publication permission unrecorded, even when their source attachment contains prior review notes. Saved operator records retain their declared reviews for inspection.

### Proposed Keythorn pilot

The pilot would begin with three to five permitted, anonymized evidence packs in an agreed workflow. For each event, the operator would supply the authorised task, execution evidence, observed consequences and a dated loss account, including the basis for zero, estimated and unknown amounts. A source inventory would identify the artefact holder and the assertions each reference supports, while the public record would contain only the material permitted for disclosure.

A first coder would reconstruct the event and reconcile its losses. A second reviewer would work from the cited artefacts and record a dated finding, corrections and unresolved differences. Source review, event identity, a dated loss account, second review and disclosure scope each have a visible completeness check in the application. Editing substantive case fields returns the second-review status to pending. The checks establish what has been entered; they cannot establish whether the referenced artefacts are genuine or the reviewers’ judgments are correct.

The initial result would be a reviewed case series showing which events occurred, how their losses were established and what remains uncertain. For cases with a matched public account, the comparison would examine which financial and causal details the operator evidence adds. A finding that the operator packet adds little, contradicts a public account or weakens the case for a safeguard would remain part of the result.

### Interview provenance

Keythorn Rounds A–C are design inputs for this prototype. A publishable methods account still needs the recruitment route, participation in each round, interview dates and format, participants’ relevant experience, question guide, coding process and use of AI assistance, together with quotation and attribution permissions. These details should be checked against the authorised study records before the interview cohort is described publicly. The prototype makes no representativeness claim from those conversations.

The first example is loaded when the page opens, while the case chooser at the top provides the other four. Explore this case leads to the first tool, after which the five-step navigator follows the reading position. Essential inputs and results appear first, with fuller records and comparison tables available in place. Endnotes stay beside the material they explain, while printing opens the detailed sections and restores their previous state afterwards. Exports retain the complete records regardless of which sections are expanded.

The Dividend opens with an account of how the example produced its loss, including the safeguard that failed or intervened. That account remains visible across all six research topics so each wider question can be read against the original event. Edited loss calculations and completed appraisals appear with links back to their tools, while the export retains the case synthesis, selected topic and full research fields alongside the appraisal reasons.

Changing cases preserves the evidence notes, accounting review, calculations, comparisons, appraisals and dependency review attached to each case. Reset restores all five examples, with Undo available until the next edit. Save assessment downloads one .JSON file containing the source examples, all reader entries, the shared cohort, computed results and follow-up rules. Open assessment validates the format and restores those entries, then recalculates the results. Refresh clears browser memory, so a saved file is needed to resume afterwards. Files remain on the reader’s device unless they choose to share them, which requires a disclosure review.

Record requests open with Underwriter selected, with tailored questions also available for AI builders and enterprise buyers. The chosen role survives a case change, although Reset returns it to Underwriter. The six proposed collection families cover payments/refunds, claims/decisions, customer commitments, code/data changes, data exposure and service/regional access. Each identifies an observation unit and likely evidence holders so the request can be directed to people who can support the account. These research-informed templates concern possible workflows, with any connection to an actual Keythorn client or coverage offering still requiring verification. Their exports include common fields, source links and redaction guidance.

The reader groups reflect [Keythorn's public description](https://www.keythorn.com/) and [Casey Tewey's enterprise-buyer update](https://www.linkedin.com/posts/tewey_last-week-we-gave-the-first-public-look-at-activity-7500267866185830400-Cu2H). Workflow prompts also draw on [Stripe's agentic-commerce overview](https://stripe.com/au/resources/more/agentic-commerce), [Corgi's Technology E&O offering](https://www.corgi.insure/tech-eo), and AIUC-1's [activity logging](https://www.aiuc-1.com/accountability/log-model-activity), [customer-data boundaries](https://www.aiuc-1.com/data-and-privacy/prevent-cross-customer-data-exposure) and [processing-location documentation](https://www.aiuc-1.com/accountability/record-processing-locations). These sources inform the proposed questions; each organisation's own products and claims remain distinct.

## Public record

PUB-001 codes [Replit's account published 29 July 2025](https://replit.com/blog/doubling-down-on-our-commitment-to-secure-vibe-coding), in which the vendor reports both deletion and restoration. Because the account supplies neither a monetary-loss assessment nor a comparable-operations denominator, it remains outside the constructed cohort and its calculations. Financial fields and the incident date stay null, while the publication date identifies the source. Operator evidence and independent review are pending, and the source establishes no Keythorn customer relationship.

## Inclusion and counting

An event qualifies where the agent's decisions, tools or integrations plausibly contributed to harm or a credible near miss, with the inclusion rationale recorded alongside supporting evidence. Hazards and constructed scenarios retain separate categories so they can be distinguished from observed incidents.

Duplicate reports are merged under one event while their provenance is retained. Since a single incident may generate many erroneous transactions, the numerator must identify whether it counts incidents or failed operations before either is divided by the exposure denominator.

A public-news sample describes reported events, whereas an industry failure rate also requires matched exposure data and a defensible account of reporting coverage. Relative comparisons depend on how under-reporting varies across the industries and workflows being compared.

## Exposure and comparability

A rate is reported only when the numerator and denominator share a population, workflow, period and counting rule, with a positive denominator. That rule defines how retries, multi-step tasks, human assistance and repeated failures enter the count, so other rates remain unknown until comparability is established.

The monetary rate is net loss in USD divided by operations, multiplied by 1,000. Failure frequency is failed operations divided by operations, multiplied by 100,000. Missing loss blocks the monetary rate while missing failure count blocks frequency; either can remain calculable when the other is unknown. Both are withheld when exposure is zero or its population and period are unconfirmed. These descriptive measures use incurred amounts at their stated cutoffs, whose development must be considered before empirical comparison or pricing.

Your assessment derives workflow loss from all five current case accounts, including saved edits to inactive cases. Any incomplete case account leaves its workflow total unknown. A manual workflow-total override is labelled and takes precedence until the reader chooses Use case totals. Original examples displays the untouched source cohort, while The Dividend always follows the working assessment. The rates describe the stipulated cohort and supply no calibrated estimate of an industry’s insurance price.

Conversions between users, deployments, tasks and transactions require a documented source and an account of uncertainty. Where the resulting populations remain incompatible, their figures are reported separately.

## Causal attribution

A record distinguishes the factor that initiated a failure from those that enabled or amplified it, since several contributors may operate together. Model, harness/tooling, integration, data, human and external contributors can therefore coexist in the causal account. Trace evidence, verified environment changes and expert review support any causal conclusion, while unknowns and competing explanations remain visible. Legal liability requires its own assessment.

## Loss and severity

Net loss is direct financial loss plus non-overlapping response expense, less non-insurance recoveries, before insurance payments. Each component carries its currency, assessment date and accounting boundary so overlaps can be reconciled before the total is calculated. Pending amounts remain identifiable when later revisions change the account.

Compensation, indemnity and insurance payments transfer the burden of a loss whose underlying economic damage remains in the record. Insurance receipts therefore stay separate from non-insurance recoveries, although a retained-cost calculation can deduct received insurance payments matched to the same loss, recipient, period and accounting boundary. Claim status and coverage evidence receive separate entries because an incident's financial consequences alone do not establish the policy response.

The five severity descriptions and financial bands remain provisional until their usefulness has been tested against actual cases. Effects on life, privacy or dignity receive their own assessment because a monetary loss account cannot capture their full significance.

An estimated amount retains its source and method so a reviewer can distinguish it from an exact documented value, a weak inference or a stipulated exercise figure. Statistical confidence intervals require a method that supports that interpretation. Unknown loss is coded as null, whereas zero indicates a documented zero. Potential exposure and hypothetical avoided loss occupy separate fields because neither belongs in the realised-loss total.

## Mitigation evidence

A safeguard's account describes its function, enforcement point and owner together with the available evidence. A claim that it is installed remains distinguishable from documented settings, tests or operating observations, whose interpretation depends on the conditions, system versions and costs involved. False positives and delays are included where known because the safeguard may also disrupt legitimate work.

Premium credits and numerical risk reductions require supporting evidence and underwriting judgment, particularly where controls overlap or share failure modes. Comparison with the workflow's actual baseline shows what the proposed safeguard changes, including residual risk and effects on legitimate work.

Control appraisal records a keep, improve or retire decision with its reason, evidence level, reference and test version, comparative test outcome, operating cost and residual uncertainty. A follow-up owner, review date and observed outcome connect the decision to its later review. A decision counts as recorded once its reason is supplied, while its supporting evidence receives separate scrutiny in The Dividend. A keep decision without referenced performance evidence prompts testing; improvement prompts a comparative test; retirement prompts a replacement or explicit acceptance of remaining exposure. Once the relevant outcome and references are recorded, the associated open follow-up can close. Negative findings can therefore support retirement, with the later result retained for review. Completing these fields records the reader’s assessment without granting an automatic premium credit.

## Historical comparisons

A useful historical comparison matches the task and failure to the affected party, payment or claims process and recovery mechanism. Differences in speed, volume, authority, detectability, reversibility and shared dependencies show where the analogy may break down, with human-operated precedents distinguished from earlier automation. Historical claims can suggest questions and loss categories, although frequencies and adjustment factors require evidence from the agent workflow itself.

Each example now has a linked public comparison whose source class is stated: a DOJ refund-fraud account, a DOJ OIG payment audit, an HHS OIG claims audit, a CanLII tribunal excerpt concerning a chatbot, or a Scamwatch account based on one or more scam reports. Their legal settings, mechanisms and reporting bases differ from the examples, as the comparison notes explain. External amounts remain outside the constructed cohort. The sources provide operational or legal comparisons while access to matched insurance claims remains pending.

## The Dividend

The Dividend combines the source case with a separate working assessment. Inspectable rules prioritise accounting gaps, source review, control decisions, cohort comparability, open recovery, historical differences and release scope. Each follow-up explains the entry that triggered it, the evidence needed and the tool in which it can be addressed. The first priority opens for reading, with further checks available in place. Free text is carried as the reader’s reasoning without automated factual verification.

The wider implication responds to the recorded dependency and fallback: shared infrastructure raises concentration questions, a common fallback raises continuity questions, and claimed independence prompts a test of the alternative. Country names describe the parties and intermediaries without implying a geopolitical cause. Six sourced research lenses remain available for exploration. The follow-up export includes the rules and current assessment; the full assessment file also carries all five cases for reopening.

The exported fields define future evidence collection, with company positions attributed to their sources so they can be distinguished from findings that would require empirical study.

A wider claim depends on a specified workflow and an evidenced mechanism, particularly where several losses are attributed to a shared event. Geopolitical and infrastructure shocks enter the account through the agent's documented contribution to the loss, with observed facts distinguished from known dependencies and conditional implications.

## Evidence packets and proposed comparison

The browser form checks whether fields have been completed, while source verification and disclosure review remain the reviewer's responsibility. The Markdown export provides a review copy of the browser entries, with the common record template available for structured coding.

The proposed public-versus-operator study begins with accounts matched to the same event under a fixed evidence cutoff and coding rubric. Independent initial coding, blinded to the other assessment, would allow differences in financial ranges, recoveries, causal judgments, control evidence and coding effort to be examined. Adjudication would retain any unresolved differences, while unmatched cases could form a reviewed case series.

## Validation and revision

Publication requires source checks for empirical numbers, exposure matching, arithmetic and component overlap, together with review of release permissions and attribution. Independent recoding of a subset of cases would expose disagreements for resolution or explicit retention. The schema, methods, case records and calculations are versioned together so earlier assessments remain recoverable after material changes.

The prototype's contribution is described in relation to existing reporting, insurance and evaluation work, with any claims limited by the evidence available in that release.

## Selected foundations

- MIT AI Risk Mitigation Map: https://airisk.mit.edu/ai-risk-mitigations
- CAS, Basic Ratemaking: https://www.casact.org/sites/default/files/2021-03/5_Werner_Modlin.pdf
- NIST AI RMF Core: https://airc.nist.gov/airmf-resources/airmf/5-sec-core/
- OECD common incident-reporting framework: https://oecd.ai/en/ai-publications/towards-a-common-reporting-framework-for-ai-incidents
- Trout et al., Underwriting the Agent Economy (2026 preprint): https://arxiv.org/abs/2607.11999
- Xu et al., When Agent Automation Becomes Profitable (2026 preprint): https://arxiv.org/abs/2606.16465
- Szpruch et al., Insuring AI (2026): https://hdsr.mitpress.mit.edu/pub/f10qbic0/release/2
- FSB, AI monitoring: https://www.fsb.org/2025/10/fsb-outlines-next-steps-for-authorities-on-ai-monitoring/
- IEA, Key Questions on Energy and AI: https://www.iea.org/reports/key-questions-on-energy-and-ai/executive-summary
- Lloyd's / Cambridge, Shifting powers (2022): https://www.lloyds.com/insights/risk-reports/shifting-powers-geopolitics-threat-of-physical-cyber-risk
`,Fr=`# *Agency Costs* — Release and contribution guide

Peter H. Vartanian · Michael Wong · Casey Tewey

## Editorial revision — 9 September 2026

### Assessment revision

- Added operator-case intake across all five tools and the Dividend, with separate identity, evidence, loss, exposure, historical comparison and safeguard records. Five worked examples remain available alongside up to 25 operator cases.
- Added individual record import/export, including common schema 0.4 intake. Imported source records remain attached; uncertain ranges stay out of the point-value calculator and non-USD records require documented conversion.
- Added second-review fields, component-source references and disclosure completeness checks. Substantive edits return the second review to pending.
- Added control follow-up owners, dates and observed outcomes, including findings supporting retirement. The Dividend responds to the resulting evidence and unresolved checks.

- The five source examples now include execution trails, accounting boundaries and follow-up cutoffs. Camera resale, an open supplier balance, claim entitlement, a commercial concession and the held transfer are separately accounted for, preserving the original net totals.

- Tool 4 links each example to a documented public comparison with its source type and limits; external figures remain outside the example cohort.
- Tool 5 records evidence level, references, comparative test findings, operating cost and uncertainty alongside the control decision.

- Case switching retains work for all five examples. Save assessment and Open assessment support one complete, locally downloaded .JSON assessment, with validation and reversible import.
- Common record schema: 0.4. Example schema: 1.2. Saved-assessment format: 1.1, with 1.0 files still readable. Individual operator-record format: 1.0. The publication remains v0.1 pending independent domain review.

### Earlier copy revision

The explanatory prose now follows the relationships between events, controls and losses, with fuller case accounts in place of clipped summaries and directive prompts. The same revision extends through the Dividend, evidence requests, local notes and supporting materials. Layout, numerical inputs, accounting rules, source status and the five-tool order are unchanged.

## v0.1 — 8 September 2026

- Status: prototype; independent domain validation pending.
- Updated: underwriters are the primary audience, with a case assessment and outstanding evidence as the intended outcome. Record requests default to Underwriter; builder and buyer options remain available. The Dividend frames its follow-up questions around the underwriting assessment, including shared and cross-border exposure.
- Contributed real Keythorn records: 0.
- Public incident accounts coded into this release: 1 (Replit; vendor account; independent review pending; monetary loss undisclosed).
- The Dividend: six sourced research questions and proposed measurements.
- Mock-up tables: constructed examples for demonstration.
- Example collection: five fictional records covering refunds, duplicate payments, claim overpayment, a service promise and a blocked cross-border transfer. All amounts and activity counts are stipulated.
- Updated: stable identity codes and country-level geography across all five examples. EX-005 links Operator E in the UK, Supplier E1 in Taiwan, Bank E1 in Singapore and Bank E2 in the US; structured jurisdiction and payment-route fields appear in the record, evidence packet and exports. The example schema is v1.1; loss amounts and cohort counts are unchanged.

- Updated: The Dividend states its purpose and connects each example’s loss and safeguard finding to a wider question. The case bridge persists across topics, carries edited calculations and appraisal totals, and accompanies the research export.
- Added: role-specific record requests for builders, enterprise buyers and underwriters, covering six workflow families; downloadable request checklists and a separate public-record export.
- Reordered: Evidence packs → Loss accounts → Loss-cost index → Human-claims crosswalk → Control appraisal → The Dividend. This retains the five original components in the order 2 → 3 → 1 → 5 → 4.
- Added: section-to-section links and safeguard appraisals with keep, improve or retire decisions, reasons, a local export and a summary in The Dividend.
- Updated: endnote numbering, contribution mappings and Dividend links/exports. Descriptive anchors are canonical; earlier numbered links still open their original components. Contributions now follows The Dividend.
- Independent domain reviewers recorded: 0.
- Included: the tool-kit; a common record; methods, dictionary and contribution documents; The Dividend bonus.
- Updated: centred title and byline; equal-width navigation; MIT AIRI framework credit alongside Keythorn's proposed inputs; explicit bonus labels; direct descriptions and shorter notes throughout the page and materials.
- Preserved: earlier bonus links, which now open The Dividend.

## Validation status

The first case and constructed cohort load when the page opens, with Explore this case leading to the first tool. Both case choosers restore the selected case’s saved entries while retaining the shared cohort. Individual loss edits flow into case-derived working totals; explicit manual totals are labelled and can return to the case sum. The original examples remain unchanged. Reset clears all five drafts, while Undo restores them until the next edit. Refresh returns to the opening state, from which Open assessment can restore a saved .JSON file.

Request a record starts with Underwriter selected, with its checklist adapted to the chosen reader and workflow. Loading an example selects the related request family while preserving the reader, whereas Reset restores Underwriter and Payments & refunds. Undo recovers the previous selections, and requests download locally as .MD files. The public Replit record has its own .JSON download because its unknown amounts and vendor-account status keep it separate from the example cohort's calculations.

Appraisals remain attached to each safeguard and case across switches. A decision counts as recorded once its reason is supplied, while The Dividend separately checks whether supporting tests, references, operating costs and uncertainty have been entered. User-entered judgments leave source events and loss calculations unchanged. Imports restore validated entries and recalculate the follow-up; malformed, incompatible or oversized files leave the current assessment intact.

The calculations demonstrate accounting with supplied values and stated definitions, while empirical failure rates, control effects and industry comparisons await case collection and exposure matching. Premiums and coverage interpretations require an insurer's assessment beyond the form’s completeness checks. The Dividend explains which entries give rise to each follow-up, while its wider question responds to the reader’s dependency and fallback review. Source verification, permissions and independent validation remain outstanding.

Severity, confidence and loss bands remain provisional until real-world event coding, inter-reviewer checks and exposure matching support an empirical release with contribution permissions. Institutional credits identify sources and proposed contributions, while endorsement requires separate authorisation.

## Contribute an event

1. The contribution begins with New operator case in the HTML or record-template.json, whose fields are defined in data-dictionary.md. Import operator record opens a completed template, with the workflow, authority, actual action and consequences available for review against the supplied evidence.
2. Each assertion retains its observed, estimated, inferred or unknown status so alternative explanations and uncertainty remain visible.
3. Disclosure permission identifies the authorised person or organisation, scope, date and supporting evidence, while anonymization is documented separately.
4. The public copy omits credentials, personal data and raw customer logs, with other identifying or sensitive details generalised according to the agreed disclosure scope.
5. A second reviewer checks the causal account, loss accounting and release permission, retaining any disagreements that remain unresolved.
6. The locally exported packet is submitted through a channel agreed with the project owners.

A public data release depends on agreement over contributor contact, attribution, reuse terms and a licence.
